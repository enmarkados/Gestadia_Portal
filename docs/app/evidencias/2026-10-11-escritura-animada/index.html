<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificación del indicador de escritura de Gestadia</title><style>:root{--muted:#555}body{font-family:system-ui;margin:0;background:#f5f5f5;color:#191919}main{max-width:390px;margin:36px auto;padding:22px;background:white;border-radius:16px}header{font-size:12px;border-bottom:1px solid #ddd;padding-bottom:14px}.bubble{background:#eee;border-radius:14px;padding:16px;margin:20px 0}.lidia-typing { margin: 10px 0 4px; color: var(--muted); font-size: 13px; }
.lidia-typing-label { display: inline-block; animation: lidia-typing-label 1600ms ease-in-out infinite; }
.lidia-typing-dots { display: inline-flex; margin-left: 3px; }
.lidia-typing-dots > span { display: inline-block; width: 5px; font-size: 18px; line-height: 1; animation: lidia-typing-dot 1200ms ease-in-out infinite; }
.lidia-typing-dots > span:nth-child(2) { animation-delay: 160ms; }
.lidia-typing-dots > span:nth-child(3) { animation-delay: 320ms; }
@keyframes lidia-typing-label { 0%, 100% { opacity: .68; } 50% { opacity: 1; } }
@keyframes lidia-typing-dot { 0%, 60%, 100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) {
  .lidia-typing-label, .lidia-typing-dots > span { animation: none; opacity: 1; transform: none; }
}
</style><main><header>GESTADIA · Verificación visual local<br>Indicador aislado, sin envío ni conexión a LidIA</header><div class="bubble">Esperando la respuesta de LidIA</div><p class="lidia-typing" role="status" aria-label="LidIA está escribiendo"><em><span class="lidia-typing-label">LidIA está escribiendo</span><span class="lidia-typing-dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></em></p></main></html>
