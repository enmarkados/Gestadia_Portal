<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#181818" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Consulta a LidIA, gestiona tus trámites DGT y revisa tu documentación con Gestadia."
    />
    <link rel="icon" href="./icons/app-icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/app-icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Gestadia · App</title>
    <script src="./app-config.js"></script>
    <style>
      #launch-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #191919;
        color: white;
        font-family: system-ui, sans-serif;
      }
      #launch-splash img {
        width: 112px;
        height: 112px;
        border-radius: 24px;
        margin-bottom: 24px;
      }
      #launch-splash strong {
        font:
          700 42px Georgia,
          serif;
        letter-spacing: -1px;
      }
      #launch-splash strong span {
        color: #c0392b;
      }
      #launch-splash p {
        color: #ddd;
        font-size: 14px;
        margin-top: 10px;
      }
      #launch-splash .loading {
        width: 32px;
        height: 3px;
        background: #c0392b;
        border-radius: 3px;
        margin-top: 32px;
        animation: launch-pulse 1s ease-in-out infinite alternate;
      }
      @keyframes launch-pulse {
        to {
          opacity: 0.35;
          transform: scaleX(0.6);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #launch-splash .loading {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="launch-splash" role="status" aria-label="Preparando Gestadia">
      <img src="./icons/app-icon-192.png" alt="" /><strong
        >gestadia<span>.</span></strong
      >
      <p>Trámites DGT Online</p>
      <span class="loading" aria-hidden="true"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
