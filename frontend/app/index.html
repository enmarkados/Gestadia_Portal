<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#181818" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Consulta a LidIA, gestiona tus trámites DGT y revisa tu documentación con Gestadia."
    />
    <link rel="icon" href="./icons/app-icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/app-icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Gestadia · App</title>
    <script src="./app-config.js"></script>
    <style>
      #launch-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #181818;
        color: white;
        font-family: system-ui, sans-serif;
      }
      #launch-splash img {
        width: min(280px, calc(100vw - 80px));
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="launch-splash" role="status" aria-label="Preparando Gestadia">
      <img
        src="./brand/gestadia-logo-completo.png"
        alt="Gestadia"
        width="702"
        height="176"
      />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
